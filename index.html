<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bóng Đá Thứ 7</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1b4332">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow" data-i18n="thisWeek">Tuần này</p>
      <h1>Bóng Đá Thứ 7</h1>
    </div>
    <div class="topbar-actions">
      <button id="langToggle" class="chip-btn" type="button">EN</button>
      <span id="statusBadge" class="status-badge is-open">Open</span>
    </div>
  </header>

  <main class="page">
    <section id="loadingState" class="state-card">
      <div class="spinner"></div>
      <p data-i18n="loading">Đang tải...</p>
    </section>

    <section id="emptyState" class="state-card" hidden>
      <h2 data-i18n="noSessionTitle">Chưa có buổi đá</h2>
      <p data-i18n="noSessionBody">Admin mở poll để mọi người đăng ký.</p>
    </section>

    <section id="pollContent" hidden>
      <article id="counterCard" class="counter-card">
        <p id="sessionDate" class="session-date">--</p>
        <div class="counter-line">
          <strong id="goingCount">0 / 21 Going</strong>
          <span id="lockText" data-i18n="spotsOpen">Còn chỗ</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </article>

      <a id="seeTeamsBtn" class="primary-link" href="#teamsSection" hidden data-i18n="seeTeams">Xem đội</a>

      <div id="slotsNotif" class="slots-notif" hidden></div>

      <section id="myRsvpBlock" class="my-rsvp-card">
        <p class="section-kicker" data-i18n="yourStatus">RSVP của bạn</p>
        <h2 id="myRsvpName">--</h2>
        <button id="myRsvpBtn" class="my-rsvp-btn" type="button">Đăng ký đi đá</button>
      </section>

      <section id="goingListBlock" class="going-section">
        <div class="going-title-row">
          <h2 data-i18n="goingNow">Danh sách đi đá</h2>
          <span id="goingListBadge" class="pill">0</span>
        </div>
        <ul id="goingListItems" class="going-list"></ul>
      </section>

      <section id="paySection" hidden>
        <a id="payLink" href="/payment.html" class="pay-section-link">
          <span>💰 Thanh toán tiền sân</span>
          <span class="pay-section-badge">35,000đ →</span>
        </a>
      </section>

      <section id="teamsSection" class="teams-section" hidden>
        <div class="section-head">
          <div>
            <h2 data-i18n="teams">Đội hình</h2>
            <p data-i18n="teamsReadyText">Đội đã được admin mở khóa.</p>
          </div>
        </div>
        <div id="teamCards" class="team-stack"></div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/rsvp.js?v=6"></script>
</body>
</html>
