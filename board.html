<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Board — Bóng Đá Thứ 7</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a1628">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { max-width: 100%; background: #0a1628; }
    .board-page { max-width: 100%; }
  </style>
</head>
<body>

<div class="board-page" id="boardPage">
  <!-- Header -->
  <div class="board-header">
    <h1>⚽ Bóng Đá Thứ 7</h1>
    <span class="board-refresh" id="refreshInfo">Auto-refresh 30s</span>
  </div>

  <!-- Loading -->
  <div id="loadingState" class="loading" style="background:#0a1628;color:#fff">
    <div class="spinner" style="border-color:rgba(255,255,255,.2);border-top-color:#95d5b2"></div>
    <span>Loading...</span>
  </div>

  <!-- No session / not playing -->
  <div id="idleState" style="display:none;text-align:center;padding:60px 20px;color:rgba(255,255,255,.5)">
    <div style="font-size:3rem;margin-bottom:16px">⏳</div>
    <div style="font-size:1.1rem;font-weight:700" id="idleMsg">Chưa có trận đấu</div>
    <div style="font-size:.85rem;margin-top:8px" id="idleSession"></div>
  </div>

  <!-- Live content -->
  <div id="liveContent" style="display:none" class="board-main">

    <!-- ON COURT -->
    <div class="court-card" id="courtCard">
      <div class="court-label" id="courtLabel">ĐANG ĐÁ</div>
      <div class="court-teams" id="courtTeams">
        <div class="court-team" id="teamA">—</div>
        <div class="court-vs">VS</div>
        <div class="court-team" id="teamB">—</div>
      </div>
      <div class="board-timer" id="matchTimer">15:00</div>
      <div style="font-size:.78rem;opacity:.45;letter-spacing:1px" id="timerLabel">THỜI GIAN TRẬN</div>
    </div>

    <!-- NEXT / RESTING -->
    <div class="next-cards">
      <div class="next-card">
        <div class="next-label" id="nextLabel">TIẾP THEO</div>
        <div class="next-team" id="nextTeam">—</div>
      </div>
      <div class="next-card">
        <div class="next-label" id="restLabel">NGHỈ</div>
        <div class="next-team" id="restTeam">—</div>
      </div>
    </div>

    <!-- Match history -->
    <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);padding:14px">
      <div style="font-size:.68rem;letter-spacing:2px;text-transform:uppercase;opacity:.4;margin-bottom:10px">LỊCH SỬ TRẬN</div>
      <div id="historyList" style="color:rgba(255,255,255,.7)">
        <div style="opacity:.4;font-size:.85rem">Chưa có trận nào</div>
      </div>
    </div>

    <!-- 4-team schedule (shown when 4 teams) -->
    <div id="scheduleSection" style="display:none;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);padding:14px">
      <div style="font-size:.68rem;letter-spacing:2px;text-transform:uppercase;opacity:.4;margin-bottom:10px">LỊCH 4 ĐỘI</div>
      <div id="scheduleList" style="color:rgba(255,255,255,.7)"></div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/board.js"></script>
</body>
</html>
