<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bóng Đá Thứ 7</title>
  <meta name="theme-color" content="#1b4332">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css?v=4">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Boot splash ──────────────────────────────────────────── */
    .boot-splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 42px;
      background: radial-gradient(120% 85% at 50% 34%, #241914, #17110d);
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      transition: opacity 0.4s ease;
    }

    .boot-splash.boot-hide {
      opacity: 0;
      pointer-events: none;
    }

    .boot-mark { width: 164px; height: 164px; animation: bootTileIn 0.5s cubic-bezier(.2,.7,.2,1) both; }
    .boot-track { opacity: 0; animation: bootFadeIn 0.4s ease 0.4s both; }
    .boot-draw  { stroke-dasharray: 1; animation: bootDraw 1.05s cubic-bezier(.5,.05,.2,1) 0.55s both; }
    .boot-caption { text-align: center; animation: bootRiseUp 0.6s ease 1.55s both; }
    .boot-caption .boot-by  { font-size: 14px; color: rgba(255,255,255,.8); }
    .boot-caption .boot-brand { font-size: 20px; font-weight: 700; letter-spacing: .14em; color: #fff; margin-top: 3px; }

    @keyframes bootTileIn { from { opacity:0; transform: scale(.6); } to { opacity:1; transform: scale(1); } }
    @keyframes bootFadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes bootDraw   { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes bootRiseUp { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform: none; } }

    body {
      min-height: 100vh;
      background: #1b4332;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ── Welcome hero ─────────────────────────────────────────── */
    .welcome {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 260px;
      text-align: center;
      pointer-events: none;
    }

    .welcome-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.5px;
      line-height: 1.15;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s ease 0.7s forwards;
    }

    .welcome-sub {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.6);
      margin-top: 8px;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s ease 0.9s forwards;
    }

    /* ── Login card (bottom sheet) ────────────────────────────── */
    .login-sheet {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 28px 28px 0 0;
      padding: 28px 24px 48px;
      position: relative;
      z-index: 10;
      transform: translateY(100%);
      animation: sheetUp 0.55s cubic-bezier(.32,.72,0,1) 1.1s forwards;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.25);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: #e5e7eb;
      border-radius: 99px;
      margin: 0 auto 24px;
    }

    .sheet-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #111;
      margin-bottom: 4px;
    }

    .sheet-sub {
      font-size: 0.82rem;
      color: #6b7280;
      margin-bottom: 24px;
    }

    /* ── Form fields ──────────────────────────────────────────── */
    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #e5e7eb;
      border-radius: 14px;
      font-size: 1rem;
      color: #111;
      background: #f9fafb;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    .field input:focus {
      border-color: #1b4332;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(27,67,50,0.12);
    }

    .field input.error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
    }

    .field-error {
      font-size: 0.76rem;
      color: #ef4444;
      margin-top: 5px;
      display: none;
    }

    .field-error.show { display: block; }

    /* ── Submit button ────────────────────────────────────────── */
    .btn-join {
      width: 100%;
      padding: 16px;
      background: #1b4332;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.15s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-join:active { transform: scale(0.97); }
    .btn-join:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }

    .btn-join.loading::after {
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }

    /* ── Animations ───────────────────────────────────────────── */
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes sheetUp {
      to { transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Boot splash: plays once, then fades to reveal the login screen -->
  <div class="boot-splash" id="bootSplash">
    <svg class="boot-mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="22" fill="#2C1A0E"></rect>
      <path class="boot-track" d="M 14 44 L 14 58 Q 14 74 28 74 Q 42 74 42 58 L 42 42 Q 42 24 56 24 Q 70 24 70 42 L 70 58 Q 70 72 82 72 L 88 72" stroke="rgba(255,255,255,0.11)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"></path>
      <path class="boot-draw" pathLength="1" d="M 14 44 L 14 58 Q 14 74 28 74 Q 42 74 42 58 L 42 42 Q 42 24 56 24 Q 70 24 70 42 L 70 58 Q 70 72 82 72 L 88 72" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <div class="boot-caption">
      <div class="boot-by">Một sản phẩm được phát triển bởi</div>
      <div class="boot-brand">VNBOT</div>
    </div>
  </div>

  <!-- Welcome hero -->
  <div class="welcome">
    <h1 class="welcome-title">Bóng Đá<br>Thứ 7</h1>
    <p class="welcome-sub">Đăng ký để tham gia buổi đá</p>
  </div>

  <!-- Login bottom sheet -->
  <div class="login-sheet">
    <div class="sheet-handle"></div>
    <p class="sheet-title">Chào mừng!</p>
    <p class="sheet-sub" id="sheetSub">Chọn tên của bạn trong danh sách.</p>

    <!-- Step 1: pick your name from the roster -->
    <div id="pickerStep">
      <div class="field">
        <input
          id="nameSearchInput"
          class="input"
          type="search"
          placeholder="Tìm tên của bạn..."
          oninput="filterNamePicker(this.value)"
        >
      </div>
      <div id="namePickerList" class="vote-list" style="margin-bottom:16px;max-height:340px;overflow-y:auto"></div>
      <button class="btn-join" id="notListedBtn" type="button" onclick="showManualForm()" style="background:#f3f4f6;color:#111">
        Tên tôi không có trong danh sách
      </button>
    </div>

    <!-- Step 2: claim a pending (pre-rated, not-yet-logged-in) name -->
    <div id="claimStep" hidden>
      <p class="sheet-sub">Xác nhận số điện thoại cho <strong id="claimName">--</strong></p>
      <div class="field">
        <label for="claimPhoneInput">Số điện thoại</label>
        <input
          id="claimPhoneInput"
          type="tel"
          placeholder="0912 345 678"
          autocomplete="tel"
          maxlength="11"
          inputmode="numeric"
        >
        <p class="field-error" id="claimPhoneError">Số điện thoại chưa đúng (VD: 0912345678).</p>
      </div>
      <label style="display:flex;align-items:center;gap:12px;margin-bottom:20px;cursor:pointer;user-select:none">
        <input type="checkbox" id="claimGkCheck" style="width:20px;height:20px;accent-color:#1b4332;cursor:pointer;flex-shrink:0">
        <span style="font-size:0.95rem;font-weight:600;color:#374151">🧤 Tôi là thủ môn</span>
      </label>
      <button class="btn-join" id="claimBtn" type="button" onclick="confirmClaim()">Vào sân ⚽</button>
      <button class="btn-join" type="button" onclick="backToPicker()" style="background:#f3f4f6;color:#111;margin-top:8px">
        ‹ Quay lại
      </button>
    </div>

    <!-- Step 3 (fallback): manual name + phone entry for brand-new players -->
    <div id="manualStep" hidden>
      <div class="field">
        <label for="nameInput">Tên của bạn</label>
        <input
          id="nameInput"
          type="text"
          placeholder="VD: Nguyễn Văn A"
          autocomplete="name"
          maxlength="40"
        >
        <p class="field-error" id="nameError">Nhập tên của bạn.</p>
      </div>

      <div class="field">
        <label for="phoneInput">Số điện thoại</label>
        <input
          id="phoneInput"
          type="tel"
          placeholder="0912 345 678"
          autocomplete="tel"
          maxlength="11"
          inputmode="numeric"
        >
        <p class="field-error" id="phoneError">Số điện thoại chưa đúng (VD: 0912345678).</p>
      </div>

      <label style="display:flex;align-items:center;gap:12px;margin-bottom:20px;cursor:pointer;user-select:none">
        <input type="checkbox" id="gkCheck" style="width:20px;height:20px;accent-color:#1b4332;cursor:pointer;flex-shrink:0">
        <span style="font-size:0.95rem;font-weight:600;color:#374151">🧤 Tôi là thủ môn</span>
      </label>

      <button class="btn-join" id="joinBtn" onclick="handleJoin()">
        Vào sân ⚽
      </button>
      <button class="btn-join" type="button" onclick="backToPicker()" style="background:#f3f4f6;color:#111;margin-top:8px">
        ‹ Quay lại danh sách
      </button>
    </div>

    <p style="text-align:center;margin-top:20px;font-size:0.75rem;color:#9ca3af">Phát triển bởi <strong style="color:#6b7280">vnbot.vn</strong></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script>
    const IDENTITY_KEY = 'bdt7_player';
    let rosterEntries = [];   // { id, name, phone, isGoalkeeper, pending, points }
    let pendingClaim = null;  // the pending entry currently being claimed

    // Boot splash plays once (~2.15s of animation), holds briefly, then fades
    // out to reveal the login screen (already settled behind it by then).
    setTimeout(() => {
      const splash = document.getElementById('bootSplash');
      splash.classList.add('boot-hide');
      splash.addEventListener('transitionend', () => splash.remove(), { once: true });
    }, 2700);

    // Already logged in → skip to poll
    (function checkExisting() {
      try {
        const saved = localStorage.getItem(IDENTITY_KEY);
        if (saved) {
          const p = JSON.parse(saved);
          if (p.name && p.phone) window.location.replace('/index.html');
        }
      } catch (_) {}
    })();

    window.addEventListener('DOMContentLoaded', loadRoster);

    async function loadRoster() {
      try {
        const snap = await db.collection('players').get();
        const all = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        // Claimed profiles without a phone number are broken/orphaned data (e.g. old
        // seed/test docs) — they can never pass the login identity check, so hide them.
        const usable = all.filter(p => p.pending || (p.phone && String(p.phone).trim()));
        const claimedNames = new Set(usable.filter(p => !p.pending).map(p => normalizeName(p.name)));
        rosterEntries = usable
          .filter(p => !p.pending || !claimedNames.has(normalizeName(p.name)))
          .filter(p => p.name && p.name.trim())
          .sort((a, b) => String(a.name).localeCompare(String(b.name), 'vi', { sensitivity: 'base' }));
        renderNamePicker('');
      } catch (e) {
        console.warn('Roster load failed, falling back to manual form:', e.message);
        showManualForm();
      }
    }

    function normalizeName(value) {
      return String(value || '').trim().replace(/\s+/g, ' ').toLowerCase();
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;',
      }[char]));
    }

    function escAttr(value) {
      return esc(value).replace(/`/g, '&#096;');
    }

    function filterNamePicker(query) {
      renderNamePicker(query);
    }

    function renderNamePicker(query) {
      const list = document.getElementById('namePickerList');
      const search = normalizeName(query);
      const visible = search
        ? rosterEntries.filter(p => normalizeName(p.name).includes(search))
        : rosterEntries;

      if (!rosterEntries.length) {
        list.innerHTML = `<p style="text-align:center;color:#9ca3af;font-size:.85rem;padding:12px 0">Chưa có danh sách — nhập tên thủ công bên dưới.</p>`;
        return;
      }

      if (!visible.length) {
        list.innerHTML = `<p style="text-align:center;color:#9ca3af;font-size:.85rem;padding:12px 0">Không tìm thấy tên phù hợp.</p>`;
        return;
      }

      list.innerHTML = visible.map(p => `
        <button class="vote-card" type="button" data-entry-id="${escAttr(p.id)}">
          <span class="name-row">${esc(p.name)}${p.isGoalkeeper ? '<span class="gk-badge">GK</span>' : ''}</span>
          <span class="vote-state">${p.pending ? 'Chưa vào lần nào' : ''}</span>
        </button>
      `).join('');

      list.querySelectorAll('[data-entry-id]').forEach(btn => {
        btn.addEventListener('click', () => selectEntry(btn.dataset.entryId));
      });
    }

    function selectEntry(id) {
      const entry = rosterEntries.find(p => p.id === id);
      if (!entry) return;

      if (!entry.pending) {
        // Already-claimed profile — log straight in, no extra typing needed.
        const identity = {
          name: entry.name,
          phone: entry.phone || '',
          playerId: entry.id,
          isGoalkeeper: !!entry.isGoalkeeper,
        };
        localStorage.setItem(IDENTITY_KEY, JSON.stringify(identity));
        window.location.replace('/index.html');
        return;
      }

      // Pending (pre-rated, never logged in) — just need a phone number to finish.
      pendingClaim = entry;
      document.getElementById('claimName').textContent = entry.name;
      document.getElementById('claimPhoneInput').value = '';
      document.getElementById('claimGkCheck').checked = false;
      document.getElementById('claimPhoneInput').classList.remove('error');
      document.getElementById('claimPhoneError').classList.remove('show');
      setStep('claimStep');
    }

    function setStep(stepId) {
      ['pickerStep', 'claimStep', 'manualStep'].forEach(id => {
        document.getElementById(id).hidden = id !== stepId;
      });
      const subText = {
        pickerStep: 'Chọn tên của bạn trong danh sách.',
        claimStep: 'Gần xong rồi!',
        manualStep: 'Nhập tên và số điện thoại để bắt đầu.',
      };
      document.getElementById('sheetSub').textContent = subText[stepId] || '';
    }

    function showManualForm() {
      setStep('manualStep');
    }

    function backToPicker() {
      pendingClaim = null;
      setStep('pickerStep');
    }

    async function confirmClaim() {
      if (!pendingClaim) { backToPicker(); return; }
      const phone = cleanPhone(document.getElementById('claimPhoneInput').value);

      document.getElementById('claimPhoneInput').classList.remove('error');
      document.getElementById('claimPhoneError').classList.remove('show');

      if (!isValidPhone(phone)) {
        document.getElementById('claimPhoneInput').classList.add('error');
        document.getElementById('claimPhoneError').classList.add('show');
        return;
      }

      const btn = document.getElementById('claimBtn');
      btn.disabled = true;
      btn.textContent = 'Đang lưu';
      btn.classList.add('loading');

      const playerId = 'ph_' + phone;
      const isGoalkeeper = document.getElementById('claimGkCheck').checked;
      const name = pendingClaim.name;

      try {
        await db.collection('players').doc(playerId).set({
          name,
          phone,
          isGoalkeeper,
          points: pendingClaim.points,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true });
        await db.collection('players').doc(pendingClaim.id).delete();
      } catch (e) {
        console.warn('Firestore save skipped:', e.message);
      }

      localStorage.setItem(IDENTITY_KEY, JSON.stringify({ name, phone, playerId, isGoalkeeper }));
      window.location.replace('/index.html');
    }

    // Phone: strip spaces/dashes, validate Vietnamese format
    function cleanPhone(raw) {
      return raw.replace(/[\s\-().]/g, '');
    }

    function isValidPhone(phone) {
      return /^0\d{9}$/.test(phone);
    }

    async function handleJoin() {
      const name  = document.getElementById('nameInput').value.trim();
      const phone = cleanPhone(document.getElementById('phoneInput').value);
      let valid   = true;

      // Clear errors
      document.getElementById('nameInput').classList.remove('error');
      document.getElementById('phoneInput').classList.remove('error');
      document.getElementById('nameError').classList.remove('show');
      document.getElementById('phoneError').classList.remove('show');

      if (!name || name.length < 2) {
        document.getElementById('nameInput').classList.add('error');
        document.getElementById('nameError').classList.add('show');
        valid = false;
      }

      if (!isValidPhone(phone)) {
        document.getElementById('phoneInput').classList.add('error');
        document.getElementById('phoneError').classList.add('show');
        valid = false;
      }

      if (!valid) return;

      const btn = document.getElementById('joinBtn');
      btn.disabled = true;
      btn.textContent = 'Đang lưu';
      btn.classList.add('loading');

      const playerId = 'ph_' + phone;
      const isGoalkeeper = document.getElementById('gkCheck').checked;

      try {
        await db.collection('players').doc(playerId).set({
          name,
          phone,
          isGoalkeeper,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true });
      } catch (e) {
        console.warn('Firestore save skipped:', e.message);
        // localStorage is the fallback — still proceed
      }

      localStorage.setItem(IDENTITY_KEY, JSON.stringify({ name, phone, playerId, isGoalkeeper }));
      window.location.replace('/index.html');
    }

    // Allow Enter key to submit whichever step is active
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (!document.getElementById('claimStep').hidden) confirmClaim();
      else if (!document.getElementById('manualStep').hidden) handleJoin();
    });
  </script>
</body>
</html>
