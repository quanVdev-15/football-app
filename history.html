<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Sử — Bóng Đá Thứ 7</title>
  <meta name="theme-color" content="#1b4332">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .hist-hero {
      background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%);
      border-radius: 18px;
      padding: 20px 18px;
      margin-bottom: 18px;
      color: #fff;
      text-align: center;
      box-shadow: 0 6px 24px rgba(27,67,50,.4);
    }
    .hist-hero-title {
      font-size: .65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: .65;
      margin-bottom: 12px;
    }
    .hist-hero-stats {
      display: flex;
      justify-content: center;
    }
    .hist-hero-stat {
      flex: 1;
      position: relative;
    }
    .hist-hero-stat + .hist-hero-stat::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; height: 60%;
      width: 1px;
      background: rgba(255,255,255,.2);
    }
    .hist-hero-num  { font-size: 1.9rem; font-weight: 900; color: #b7e4c7; line-height: 1; }
    .hist-hero-label { font-size: .7rem; opacity: .7; margin-top: 4px; }

    /* Session cards */
    .session-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .session-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
    }
    .session-header:active { background: var(--bg); }
    .session-date-badge {
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      padding: 6px 10px;
      text-align: center;
      min-width: 44px;
      flex-shrink: 0;
    }
    .session-date-day  { font-size: 1.3rem; font-weight: 900; line-height: 1; }
    .session-date-mon  { font-size: .6rem;  font-weight: 700; opacity: .8; letter-spacing: 1px; text-transform: uppercase; }
    .session-meta      { flex: 1; }
    .session-meta-top  { font-weight: 800; font-size: .95rem; }
    .session-meta-sub  { font-size: .75rem; color: var(--text-muted); margin-top: 2px; }
    .session-chevron   { color: var(--text-muted); font-size: .9rem; transition: transform .2s; }
    .session-card.open .session-chevron { transform: rotate(90deg); }

    /* Session body */
    .session-body { display: none; border-top: 1px solid var(--border); }
    .session-card.open .session-body { display: block; }

    /* Standings */
    .standings-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    .standings-row:last-child { border-bottom: none; }
    .standings-rank {
      font-size: .8rem; font-weight: 800;
      color: var(--text-muted); min-width: 20px;
    }
    .standings-rank.r1 { color: #f59e0b; }
    .standings-rank.r2 { color: #94a3b8; }
    .standings-rank.r3 { color: #d97706; }
    .team-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .team-dot-red    { background: #e53935; }
    .team-dot-blue   { background: #1565c0; }
    .team-dot-green  { background: #2e7d32; }
    .team-dot-yellow { background: #f9a825; }
    .standings-name { flex: 1; font-weight: 700; font-size: .9rem; }
    .standings-record {
      font-size: .82rem; font-weight: 700;
      color: var(--primary);
    }
    .standings-captain { font-size: .72rem; color: var(--text-muted); }

    /* Match history */
    .match-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-bottom: 1px solid var(--border);
      font-size: .83rem;
    }
    .match-row:last-child { border-bottom: none; }
    .match-num { color: var(--text-muted); font-size: .72rem; min-width: 24px; }
    .match-team { flex: 1; font-weight: 600; }
    .match-team.winner { color: var(--primary); font-weight: 800; }
    .match-vs { color: var(--text-muted); font-size: .75rem; font-weight: 700; padding: 0 2px; }
    .match-badge { font-size: .7rem; }

    /* Players grid */
    .players-grid {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 12px 16px;
    }
    .player-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: .76rem;
      font-weight: 600;
    }

    /* Section label inside body */
    .body-section {
      padding: 10px 16px 4px;
      font-size: .65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .empty-hist {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .empty-hist .ei { font-size: 2.5rem; margin-bottom: 12px; }
  </style>
</head>
<body>

<header class="app-header">
  <h1>📋 Lịch Sử Buổi Đá</h1>
  <div class="header-right">
    <a href="/" class="admin-link">← Trang chính</a>
  </div>
</header>

<main class="container">

  <div id="loadingState" class="loading">
    <div class="spinner"></div>
    <span>Đang tải...</span>
  </div>

  <div id="content" style="display:none">

    <!-- Hero totals -->
    <div class="hist-hero">
      <div class="hist-hero-title">Tổng kết toàn mùa</div>
      <div class="hist-hero-stats">
        <div class="hist-hero-stat">
          <div class="hist-hero-num" id="heroSessions">—</div>
          <div class="hist-hero-label">Buổi đã đá</div>
        </div>
        <div class="hist-hero-stat">
          <div class="hist-hero-num" id="heroMatches">—</div>
          <div class="hist-hero-label">Trận đã đấu</div>
        </div>
        <div class="hist-hero-stat">
          <div class="hist-hero-num" id="heroPlayers">—</div>
          <div class="hist-hero-label">Lượt tham dự</div>
        </div>
      </div>
    </div>

    <div id="sessionList"></div>

  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script src="/js/utils.js"></script>
<script>

window.addEventListener('DOMContentLoaded', async () => {
  try {
    const snap = await db.collection('sessions')
      .where('status', '==', 'done')
      .orderBy('date', 'desc')
      .limit(52) // 1 year
      .get();

    const sessions = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('content').style.display = '';

    renderHero(sessions);
    renderList(sessions);
  } catch (e) {
    console.error(e);
    document.getElementById('loadingState').innerHTML =
      '<div style="color:var(--danger);text-align:center;padding:30px">Không thể tải dữ liệu</div>';
  }
});

function renderHero(sessions) {
  const totalMatches   = sessions.reduce((s, sess) => s + (sess.summary?.totalMatches || 0), 0);
  const totalAttendance = sessions.reduce((s, sess) => s + (sess.summary?.totalPlayers || 0), 0);
  document.getElementById('heroSessions').textContent = sessions.length;
  document.getElementById('heroMatches').textContent  = totalMatches;
  document.getElementById('heroPlayers').textContent  = totalAttendance;
}

function renderList(sessions) {
  const el = document.getElementById('sessionList');
  if (!sessions.length) {
    el.innerHTML = `<div class="empty-hist"><div class="ei">📋</div>Chưa có buổi nào kết thúc</div>`;
    return;
  }
  el.innerHTML = sessions.map((sess, i) => sessionCard(sess, i)).join('');
}

function sessionCard(sess, idx) {
  const date = sess.date?.toDate ? sess.date.toDate() : new Date(sess.date);
  const day   = date.getDate();
  const month = date.toLocaleString('vi-VN', { month: 'short' });
  const year  = date.getFullYear();

  const sum = sess.summary;
  const hasSum = !!sum;

  const matchCount   = sum?.totalMatches  || '—';
  const playerCount  = sum?.totalPlayers  || '—';
  const topTeam      = sum?.topTeam;

  const metaSub = hasSum
    ? `${playerCount} người · ${matchCount} trận${topTeam ? ` · 🏆 ${esc(topTeam.name)}` : ''}`
    : 'Chưa có dữ liệu chi tiết';

  return `<div class="session-card" id="sc-${idx}">
    <div class="session-header" onclick="toggleCard(${idx})">
      <div class="session-date-badge">
        <div class="session-date-day">${day}</div>
        <div class="session-date-mon">${month} ${year}</div>
      </div>
      <div class="session-meta">
        <div class="session-meta-top">Buổi đá thứ 7</div>
        <div class="session-meta-sub">${metaSub}</div>
      </div>
      <div class="session-chevron">›</div>
    </div>
    <div class="session-body" id="sb-${idx}">
      ${hasSum ? renderBody(sum) : noSummaryHtml()}
    </div>
  </div>`;
}

function renderBody(sum) {
  return standingsSection(sum.teams || [])
    + matchHistorySection(sum.matchHistory || [])
    + attendanceSection(sum.attendance || []);
}

function standingsSection(teams) {
  if (!teams.length) return '';
  const sorted = [...teams].sort((a, b) => (b.wins || 0) - (a.wins || 0));
  const rankClass = ['r1', 'r2', 'r3'];
  const medals    = ['🥇', '🥈', '🥉'];

  return `<div class="body-section">Bảng xếp hạng</div>
  ${sorted.map((t, i) => `
    <div class="standings-row">
      <div class="standings-rank ${rankClass[i] || ''}">${medals[i] || (i + 1)}</div>
      <div class="team-dot team-dot-${t.color || 'green'}"></div>
      <div class="standings-name">
        ${esc(t.name)}
        ${t.captainName ? `<span class="standings-captain"> · 🏆 ${esc(t.captainName)}</span>` : ''}
      </div>
      <div class="standings-record">${t.wins || 0}W ${t.losses || 0}L</div>
    </div>
  `).join('')}`;
}

function matchHistorySection(history) {
  if (!history.length) return '';
  return `<div class="body-section">Lịch sử trận (${history.length})</div>
  ${history.map((m, i) => {
    const aWon = m.winnerId === m.teamA?.id;
    const bWon = m.winnerId === m.teamB?.id;
    const timeStr = m.time ? new Date(m.time).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : '';
    return `<div class="match-row">
      <div class="match-num" style="min-width:28px">
        <div>#${i + 1}</div>
        ${timeStr ? `<div style="font-size:.65rem;color:var(--text-muted)">${timeStr}</div>` : ''}
      </div>
      <div class="match-team${aWon ? ' winner' : ''}">${esc(m.teamA?.name || '?')}</div>
      <div class="match-vs">VS</div>
      <div class="match-team${bWon ? ' winner' : ''}">${esc(m.teamB?.name || '?')}</div>
      <div class="match-badge">${m.winnerId ? '🏆' : '🤝'}</div>
    </div>`;
  }).join('')}`;
}

function attendanceSection(attendance) {
  if (!attendance.length) return '';
  return `<div class="body-section">Tham dự (${attendance.length})</div>
  <div class="players-grid">
    ${attendance.map(p => `<div class="player-chip">${esc(p.name)}</div>`).join('')}
  </div>`;
}

function noSummaryHtml() {
  return `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:.85rem">
    📭 Buổi này chưa có dữ liệu chi tiết.<br>
    <span style="font-size:.75rem">Chỉ các buổi kết thúc sau bản cập nhật mới có lịch sử đầy đủ.</span>
  </div>`;
}

function toggleCard(idx) {
  const card = document.getElementById('sc-' + idx);
  card.classList.toggle('open');
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
