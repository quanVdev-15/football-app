<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phân Đội — Admin</title>
  <meta name="theme-color" content="#1b4332">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="app-header">
  <h1>⚽ Phân Đội</h1>
  <div class="header-right">
    <a href="/admin/" class="admin-link">← Hub</a>
  </div>
</header>

<main class="container" id="adminContent" style="display:none">

  <!-- No session -->
  <div id="noSessionMsg" style="display:none" class="empty">
    <div class="empty-icon">📅</div>
    <p>Chưa có buổi đá. <a href="/admin/" style="color:var(--primary);font-weight:700">Về Hub</a>.</p>
  </div>

  <!-- No RSVPs -->
  <div id="noRsvpMsg" style="display:none" class="empty">
    <div class="empty-icon">👥</div>
    <p>Chưa có ai đăng ký buổi này. Cầu thủ cần RSVP ở trang chính trước.</p>
  </div>

  <!-- Player summary -->
  <div id="summaryCard" class="card" style="display:none">
    <div class="card-header">
      <span class="card-title">Cầu thủ đăng ký</span>
      <span class="badge badge-blue" id="totalBadge">0</span>
    </div>
    <div id="summaryMeta" style="font-size:.85rem;color:var(--text-muted);margin-bottom:10px"></div>
    <div id="playerChips" style="display:flex;flex-wrap:wrap;gap:4px"></div>
  </div>

  <!-- Remix controls -->
  <div id="remixCard" class="card" style="display:none">
    <div class="form-group" style="margin-bottom:14px">
      <label class="form-label">Số đội</label>
      <div class="form-select-wrap">
        <select class="form-select" id="numTeamsSelect">
          <option value="auto">Tự động (dựa theo số cầu thủ)</option>
          <option value="3">3 đội</option>
          <option value="4">4 đội</option>
        </select>
      </div>
    </div>
    <button class="btn btn-primary btn-block btn-lg" onclick="doRemix()">
      🔀 Tạo đội ngẫu nhiên
    </button>
  </div>

  <!-- GK warning -->
  <div id="gkWarning" class="gk-warning" style="display:none;background:#fff3e0;border:1.5px solid #e65100;border-radius:12px;padding:14px 16px;margin-bottom:14px">
    <div style="font-weight:800;color:#e65100;margin-bottom:4px">⚠️ Thiếu thủ môn</div>
    <div id="gkWarningText" style="font-size:.85rem;color:#5d4037"></div>
  </div>

  <!-- Teams result -->
  <div id="teamsResult" style="display:none">
    <div id="teamCards"></div>
    <div class="team-actions" style="margin-top:4px;display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-ghost btn-block" onclick="doRemix()">🔀 Trộn lại</button>
      <button class="btn btn-success btn-block btn-lg" id="confirmBtn" onclick="confirmTeams()">
        ✅ Xác nhận & Chuyển sang Rotation
      </button>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/admin-auth.js"></script>
<script>
// ─── State ────────────────────────────────────────────────────────────────────
let session = null;
let rsvps   = [];   // { id, name, isGoalkeeper }
let _pendingTeams = null;

const TEAM_NAME_ARR  = { 3: ['Đỏ', 'Xanh', 'Vàng'],           4: ['Đỏ', 'Xanh', 'Vàng', 'Tím'] };
const TEAM_COLOR_ARR = { 3: ['red', 'blue', 'green'],           4: ['red', 'blue', 'green', 'yellow'] };
const COLOR_HEX      = { red: '#e53935', blue: '#1565c0', green: '#2e7d32', yellow: '#f9a825', Tím: '#7b1fa2' };

// ─── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => requireAuth(init));

async function init() {
  document.getElementById('adminContent').style.display = '';

  session = await getActiveSession();
  if (!session) {
    document.getElementById('noSessionMsg').style.display = '';
    return;
  }

  // Load player profiles for GK flag
  const playersSnap = await db.collection('players').get();
  const playerMap = {};
  playersSnap.docs.forEach(d => { playerMap[d.id] = d.data(); });

  // Load confirmed RSVPs
  const rsvpSnap = await db.collection('sessions').doc(session.id)
    .collection('rsvps').get();
  rsvps = [];
  rsvpSnap.docs.forEach(d => {
    const data = d.data();
    if (data.status !== 'in') return;
    const pData = playerMap[d.id] || {};
    rsvps.push({
      id: d.id,
      name: data.playerName,
      isGoalkeeper: pData.isGoalkeeper || false
    });
    (data.guests || []).forEach((g, i) => {
      if (g.name && g.name.trim())
        rsvps.push({ id: d.id + '_g' + i, name: g.name.trim() + ' (khách)', isGoalkeeper: false });
    });
  });

  if (!rsvps.length) {
    document.getElementById('noRsvpMsg').style.display = '';
    return;
  }

  document.getElementById('summaryCard').style.display = '';
  document.getElementById('remixCard').style.display = '';
  renderSummary();

  // If teams already confirmed, show them read-only
  if (session.status === 'teams') {
    const teamsSnap = await db.collection('sessions').doc(session.id).collection('teams').get();
    if (!teamsSnap.empty) {
      const existing = teamsSnap.docs.map(d => ({ ...d.data(), _saved: true }));
      renderTeamCards(existing);
      document.getElementById('teamsResult').style.display = '';
      document.getElementById('confirmBtn').textContent = '🔄 Lưu lại đội mới';
    }
  }
}

// ─── Summary ──────────────────────────────────────────────────────────────────
function renderSummary() {
  const gkCount = rsvps.filter(p => p.isGoalkeeper).length;
  const autoTeams = rsvps.length >= 23 ? 4 : 3;
  document.getElementById('totalBadge').textContent = rsvps.length;
  document.getElementById('summaryMeta').innerHTML =
    `<b>${rsvps.length}</b> cầu thủ · <b>${gkCount}</b> thủ môn · tự động: <b>${autoTeams} đội</b>`;
  document.getElementById('playerChips').innerHTML = rsvps
    .map(p => `<span class="player-pill">${p.isGoalkeeper ? '🧤 ' : ''}${esc(p.name)}</span>`)
    .join('');
}

// ─── Remix ────────────────────────────────────────────────────────────────────
function getNumTeams() {
  const val = document.getElementById('numTeamsSelect').value;
  if (val === 'auto') return rsvps.length >= 23 ? 4 : 3;
  return parseInt(val);
}

function doRemix() {
  const numTeams = getNumTeams();
  const teams = buildTeams([...rsvps], numTeams);
  _pendingTeams = teams;

  // GK warning
  const teamsWithoutGK = teams.filter(t => !t.players.some(p => p.isGK));
  const warnEl = document.getElementById('gkWarning');
  if (teamsWithoutGK.length) {
    warnEl.style.display = '';
    document.getElementById('gkWarningText').textContent =
      `${teamsWithoutGK.map(t => t.name).join(', ')} không có thủ môn. ` +
      `Đánh dấu thêm cầu thủ TM trong quản lý cầu thủ hoặc trộn lại.`;
  } else {
    warnEl.style.display = 'none';
  }

  renderTeamCards(teams);
  document.getElementById('teamsResult').style.display = '';
  document.getElementById('confirmBtn').textContent = '✅ Xác nhận & Chuyển sang Rotation';

  const tc = document.getElementById('teamCards');
  tc.classList.remove('remix-flash');
  void tc.offsetWidth;
  tc.classList.add('remix-flash');
  setTimeout(() => tc.classList.remove('remix-flash'), 400);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildTeams(players, numTeams) {
  const gks   = shuffle(players.filter(p => p.isGoalkeeper));
  const field = shuffle(players.filter(p => !p.isGoalkeeper));

  const teams = Array.from({ length: numTeams }, (_, i) => ({
    name: 'Đội ' + TEAM_NAME_ARR[numTeams][i],
    color: TEAM_COLOR_ARR[numTeams][i],
    players: [],
    subs: []
  }));

  // Hard constraint: 1 GK per team
  gks.forEach((gk, i) => {
    if (i < numTeams) teams[i].players.push({ id: gk.id, name: gk.name, isGK: true });
    else              teams[i % numTeams].subs.push({ id: gk.id, name: gk.name, isGK: true });
  });

  // Fill each team to 7 with field players
  let fi = 0;
  for (let i = 0; i < numTeams; i++) {
    const need = 7 - teams[i].players.length;
    for (let j = 0; j < need && fi < field.length; j++, fi++) {
      teams[i].players.push({ id: field[fi].id, name: field[fi].name });
    }
  }

  // Remaining players → subs (round-robin across teams)
  while (fi < field.length) {
    teams[fi % numTeams].subs.push({ id: field[fi].id, name: field[fi].name });
    fi++;
  }

  return teams;
}

// ─── Render team cards ────────────────────────────────────────────────────────
function renderTeamCards(teams) {
  document.getElementById('teamCards').innerHTML = teams.map(team => {
    const hex = COLOR_HEX[team.color] || '#999';
    const gkPlayers    = (team.players || []).filter(p => p.isGK);
    const fieldPlayers = (team.players || []).filter(p => !p.isGK);
    const subs         = team.subs || [];
    return `<div class="card" style="margin-bottom:10px;border-left:4px solid ${hex}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <div class="team-dot team-dot-${team.color}"></div>
        <div style="font-weight:800;font-size:1rem">${esc(team.name)}</div>
        <span class="badge badge-grey">${(team.players||[]).length} cầu thủ</span>
        ${subs.length ? `<span class="badge badge-yellow">${subs.length} sub</span>` : ''}
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        ${gkPlayers.map(p =>
          `<div class="draft-pick-chip" style="background:#e8f5e9;border:1px solid #a5d6a7">🧤 ${esc(p.name)}</div>`
        ).join('')}
        ${fieldPlayers.map(p =>
          `<div class="draft-pick-chip">${esc(p.name)}</div>`
        ).join('')}
        ${subs.map(p =>
          `<div class="draft-pick-chip" style="opacity:.6;font-style:italic">${p.isGK ? '🧤 ' : ''}${esc(p.name)} ↩</div>`
        ).join('')}
      </div>
    </div>`;
  }).join('');
}

// ─── Confirm ──────────────────────────────────────────────────────────────────
async function confirmTeams() {
  if (!_pendingTeams) { showToast('Hãy tạo đội trước!', 'error'); return; }

  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = 'Đang lưu...';

  try {
    const batch = db.batch();
    const sessRef = db.collection('sessions').doc(session.id);

    // Clear old teams
    const oldSnap = await sessRef.collection('teams').get();
    oldSnap.docs.forEach(d => batch.delete(d.ref));

    // Write new teams
    _pendingTeams.forEach(team => {
      batch.set(sessRef.collection('teams').doc(), {
        captainId:       null,
        captainName:     null,
        name:            team.name,
        color:           team.color,
        players:         team.players.map(p => ({ id: p.id, name: p.name })),
        subs:            team.subs.map(p => ({ id: p.id, name: p.name })),
        wins:            0,
        losses:          0,
        consecutiveWins: 0,
        tradeUsed:       false
      });
    });

    batch.update(sessRef, { status: 'teams' });
    await batch.commit();

    showToast('Đội đã được lưu! ✅', 'success');
    setTimeout(() => { location.href = '/admin/rotation.html'; }, 1000);
  } catch (e) {
    console.error(e);
    showToast('Lỗi khi lưu đội!', 'error');
    btn.disabled = false;
    btn.textContent = '✅ Xác nhận & Chuyển sang Rotation';
  }
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
