<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Phân Đội — Admin</title>
  <meta name="theme-color" content="#1b4332">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-shell admin-page admin-teams-page">

<header class="topbar">
  <div>
    <p class="eyebrow">Admin</p>
    <h1>Teams</h1>
  </div>
  <div class="topbar-actions">
    <a href="/admin/" class="chip-btn">Hub</a>
  </div>
</header>

<main class="page" id="adminContent" hidden>

  <!-- No session -->
  <div id="noSessionMsg" style="display:none" class="state-card">
    <h2>No active session</h2>
    <p>Go to Hub to open a poll first.</p>
  </div>

  <!-- No RSVPs -->
  <div id="noRsvpMsg" style="display:none" class="state-card">
    <h2>No RSVPs yet</h2>
    <p>Players need to RSVP on the main screen first.</p>
  </div>

  <!-- Player summary -->
  <section id="summaryCard" class="teams-draft-panel" style="display:none">
    <div class="teams-draft-head">
      <div>
        <span class="status-badge is-ready">3 teams</span>
        <h2>Registered players</h2>
        <p id="summaryMeta"></p>
      </div>
      <strong id="totalBadge">0</strong>
    </div>
    <div id="playerChips" class="teams-player-preview"></div>
  </section>


  <!-- GK warning -->
  <div id="gkWarning" class="teams-warning" style="display:none">
    <strong>Missing goalkeeper</strong>
    <span id="gkWarningText"></span>
  </div>

  <!-- Teams result -->
  <div id="teamsResult" style="display:none;padding-bottom:80px">
    <div id="teamCards" class="teams-admin-grid"></div>
  </div>
  <div class="teams-sticky-actions" id="confirmBar" style="display:none">
    <button class="btn btn-success btn-block" id="confirmBtn" onclick="confirmTeams()">
      Xác nhận đội
    </button>
  </div>

</main>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/admin-auth.js"></script>
<script>
// ─── State ────────────────────────────────────────────────────────────────────
let session = null;
let rsvps   = [];   // { id, name, isGoalkeeper }
let _pendingTeams = null;

const TEAM_NAME_ARR  = { 3: ['Red', 'Blue', 'Yellow'],         4: ['Red', 'Blue', 'Yellow', 'Purple'] };
const TEAM_COLOR_ARR = { 3: ['red', 'blue', 'green'],           4: ['red', 'blue', 'green', 'yellow'] };
const COLOR_HEX      = { red: '#e53935', blue: '#1565c0', green: '#2e7d32', yellow: '#f9a825', purple: '#7b1fa2' };
const PLAYER_PREVIEW_LIMIT = 12;

// ─── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => requireAuth(init));

async function init() {
  document.getElementById('adminContent').hidden = false;

  session = await getActiveSession();
  if (!session) {
    document.getElementById('noSessionMsg').style.display = '';
    return;
  }

  // Load player profiles for GK flag
  const playersSnap = await db.collection('players').get();
  const playerMap = {};
  playersSnap.docs.forEach(d => { playerMap[d.id] = d.data(); });

  // Load confirmed RSVPs
  const rsvpSnap = await db.collection('sessions').doc(session.id)
    .collection('rsvps').get();
  rsvps = [];
  rsvpSnap.docs.forEach(d => {
    const data = d.data();
    if (!['in', 'going'].includes(data.status || data.vote)) return;
    const pData = playerMap[d.id] || {};
    rsvps.push({
      id: d.id,
      name: data.playerName,
      isGoalkeeper: pData.isGoalkeeper || false
    });
    (data.guests || []).forEach((g, i) => {
      if (g.name && g.name.trim())
        rsvps.push({ id: d.id + '_g' + i, name: g.name.trim() + ' (guest)', isGoalkeeper: false });
    });
  });

  if (!rsvps.length) {
    document.getElementById('noRsvpMsg').style.display = '';
    return;
  }

  document.getElementById('summaryCard').style.display = '';
  renderSummary();

  // If teams already confirmed, show them read-only
  if (session.status === 'teams') {
    const teamsSnap = await db.collection('sessions').doc(session.id).collection('teams').get();
    if (!teamsSnap.empty) {
      const existing = teamsSnap.docs.map(d => ({ ...d.data(), _saved: true }));
      renderTeamCards(existing);
      showTeamsResult('Lưu đội mới');
      return;
    }
  }

  // Auto-shuffle on first load
  doRemix();
}

function showTeamsResult(confirmLabel) {
  document.getElementById('summaryCard').style.display = 'none';
  document.getElementById('teamsResult').style.display = '';
  document.getElementById('confirmBar').style.display = '';
  document.getElementById('confirmBtn').textContent = confirmLabel || 'Xác nhận đội';
}

// ─── Summary ──────────────────────────────────────────────────────────────────
function renderSummary() {
  const gkCount = rsvps.filter(p => p.isGoalkeeper).length;
  document.getElementById('totalBadge').textContent = rsvps.length;
  document.getElementById('summaryMeta').innerHTML =
    `${rsvps.length} players · ${gkCount} GK`;
  const visible = rsvps.slice(0, PLAYER_PREVIEW_LIMIT);
  document.getElementById('playerChips').innerHTML = visible
    .map(p => `<span class="admin-going-chip ${p.isGoalkeeper ? 'is-gk' : ''}">${esc(p.name)}${p.isGoalkeeper ? ' · GK' : ''}</span>`)
    .join('') + (rsvps.length > visible.length ? `<span class="admin-going-chip is-more">+${rsvps.length - visible.length}</span>` : '');
}

// ─── Remix ────────────────────────────────────────────────────────────────────
function getNumTeams() {
  return 3;
}

function doRemix() {
  const numTeams = getNumTeams();
  const teams = buildTeams([...rsvps], numTeams);
  _pendingTeams = teams;

  // GK warning
  const teamsWithoutGK = teams.filter(t => !t.players.some(p => p.isGK));
  const warnEl = document.getElementById('gkWarning');
  if (teamsWithoutGK.length) {
    warnEl.style.display = '';
    document.getElementById('gkWarningText').textContent =
      `${teamsWithoutGK.map(t => t.name).join(', ')} has no goalkeeper. ` +
      `Mark more GK players in the hub or reshuffle.`;
  } else {
    warnEl.style.display = 'none';
  }

  renderTeamCards(teams);
  showTeamsResult('Xác nhận đội');

  const tc = document.getElementById('teamCards');
  tc.classList.remove('remix-flash');
  void tc.offsetWidth;
  tc.classList.add('remix-flash');
  setTimeout(() => tc.classList.remove('remix-flash'), 400);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildTeams(players, numTeams) {
  const gks   = shuffle(players.filter(p => p.isGoalkeeper));
  const field = shuffle(players.filter(p => !p.isGoalkeeper));

  const teams = Array.from({ length: numTeams }, (_, i) => ({
    name: 'Đội ' + TEAM_NAME_ARR[numTeams][i],
    color: TEAM_COLOR_ARR[numTeams][i],
    players: [],
    subs: []
  }));

  // Hard constraint: 1 GK per team
  gks.forEach((gk, i) => {
    if (i < numTeams) teams[i].players.push({ id: gk.id, name: gk.name, isGK: true });
    else              teams[i % numTeams].subs.push({ id: gk.id, name: gk.name, isGK: true });
  });

  // Fill each team to 7 with field players
  let fi = 0;
  for (let i = 0; i < numTeams; i++) {
    const need = 7 - teams[i].players.length;
    for (let j = 0; j < need && fi < field.length; j++, fi++) {
      teams[i].players.push({ id: field[fi].id, name: field[fi].name });
    }
  }

  // Remaining players → subs (round-robin across teams)
  while (fi < field.length) {
    teams[fi % numTeams].subs.push({ id: field[fi].id, name: field[fi].name });
    fi++;
  }

  return teams;
}

// ─── Render team cards ────────────────────────────────────────────────────────
function renderTeamCards(teams) {
  document.getElementById('teamCards').innerHTML = teams.map(team => {
    const gkPlayers    = (team.players || []).filter(p => p.isGK);
    const fieldPlayers = (team.players || []).filter(p => !p.isGK);
    const subs         = team.subs || [];
    return `<article class="teams-admin-card team-color-${escAttr(team.color)}">
      <div class="teams-admin-head">
        <span class="team-swatch"></span>
        <div>
          <h3>${esc(team.name)}</h3>
          <p>${(team.players || []).length} players${subs.length ? ` · ${subs.length} subs` : ''}</p>
        </div>
      </div>
      <div class="teams-admin-players">
        ${gkPlayers.map((p, i) => renderTeamPlayerChip(p, i, true)).join('')}
        ${fieldPlayers.map((p, i) => renderTeamPlayerChip(p, i + gkPlayers.length, false)).join('')}
      </div>
      ${subs.length ? `<details class="teams-subs"><summary>${subs.length} subs</summary><div>${subs.map((p, i) => renderTeamPlayerChip(p, i, !!p.isGK, true)).join('')}</div></details>` : ''}
    </article>`;
  }).join('');
}

function renderTeamPlayerChip(player, index, isGk, isSub = false) {
  return `<div class="teams-player-row ${isGk ? 'is-gk' : ''} ${isSub ? 'is-sub' : ''}">
    <span>${String(index + 1).padStart(2, '0')}</span>
    <strong>${esc(player.name)}</strong>
    ${isGk ? '<em>GK</em>' : ''}
  </div>`;
}

// ─── Confirm ──────────────────────────────────────────────────────────────────
async function confirmTeams() {
  if (!_pendingTeams) { showToast('Generate teams first!', 'error'); return; }

  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const batch = db.batch();
    const sessRef = db.collection('sessions').doc(session.id);

    // Clear old teams
    const oldSnap = await sessRef.collection('teams').get();
    oldSnap.docs.forEach(d => batch.delete(d.ref));

    // Write new teams
    _pendingTeams.forEach(team => {
      batch.set(sessRef.collection('teams').doc(), {
        captainId:       null,
        captainName:     null,
        name:            team.name,
        color:           team.color,
        players:         team.players.map(p => ({ id: p.id, name: p.name })),
        subs:            team.subs.map(p => ({ id: p.id, name: p.name })),
        wins:            0,
        losses:          0,
        consecutiveWins: 0,
        tradeUsed:       false
      });
    });

    batch.update(sessRef, { status: 'teams' });
    await batch.commit();

    showToast('Teams saved!', 'success');
    setTimeout(() => { location.href = '/admin/'; }, 1000);
  } catch (e) {
    console.error(e);
    showToast('Failed to save teams!', 'error');
    btn.disabled = false;
    btn.textContent = 'Confirm teams';
  }
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(str) {
  return esc(str).replace(/`/g, '&#096;');
}
</script>
</body>
</html>
