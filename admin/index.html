<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Bóng Đá Thứ 7</title>
  <meta name="theme-color" content="#1b4332">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-shell admin-page">
  <header class="topbar">
    <div>
      <p class="eyebrow">Admin</p>
      <h1>Bóng Đá Thứ 7</h1>
      <p id="adminSessionDate" class="subtle">--</p>
    </div>
    <div class="topbar-actions">
      <button id="adminLangToggle" class="chip-btn" type="button">EN</button>
      <button class="chip-btn danger" type="button" onclick="logoutAdmin()">Logout</button>
    </div>
  </header>

  <main id="adminContent" class="page" hidden>
    <section class="admin-panel">
      <div class="section-head compact">
        <div>
          <h2 data-i18n="sessionControls">Điều khiển buổi đá</h2>
          <p id="adminStatusLine">--</p>
        </div>
        <span id="adminStatusBadge" class="status-badge is-open">Open</span>
      </div>

      <div class="button-row">
        <button class="btn primary" type="button" onclick="openPoll()" data-i18n="openPoll">Open Poll</button>
        <button class="btn secondary" type="button" onclick="lockPoll()" data-i18n="lockPoll">Lock Poll</button>
        <a class="btn accent" href="/admin/teams.html" data-i18n="randomizeTeams">Manage Teams</a>
      </div>

      <label class="field-label" for="capInput" data-i18n="maxCap">Giới hạn người chơi</label>
      <div class="inline-field">
        <input id="capInput" class="input" type="number" min="3" max="60" value="21">
        <button class="btn secondary" type="button" onclick="saveCap()" data-i18n="save">Lưu</button>
      </div>
    </section>

    <section class="admin-panel">
      <div class="section-head compact">
        <div>
          <h2 data-i18n="playerList">Danh sách cầu thủ</h2>
          <p id="gkIndicator">GKs: 0/3</p>
        </div>
        <span id="adminGoingCount" class="pill">0 Going</span>
      </div>
      <div id="adminPlayers" class="admin-player-list"></div>
    </section>

    <!-- Bank config for VietQR payment -->
    <section class="admin-panel">
      <div class="section-head compact">
        <div>
          <h2>💳 Tài khoản ngân hàng</h2>
          <p>Cầu thủ quét QR để chuyển tiền sân</p>
        </div>
      </div>
      <div class="bank-config-form">
        <div>
          <label class="field-label" for="bankCode">Ngân hàng</label>
          <select id="bankCode" class="input" style="height:48px">
            <option value="">— Chọn ngân hàng —</option>
            <option value="MB">MB Bank (Quân Đội)</option>
            <option value="VCB">Vietcombank</option>
            <option value="TCB">Techcombank</option>
            <option value="ACB">ACB</option>
            <option value="VPB">VPBank</option>
            <option value="BIDV">BIDV</option>
            <option value="ICB">Vietinbank (CTG)</option>
            <option value="TPB">TPBank</option>
            <option value="HDB">HDBank</option>
            <option value="STB">Sacombank</option>
            <option value="MSB">MSB Maritime</option>
            <option value="VIB">VIB</option>
            <option value="SHB">SHB</option>
            <option value="OCB">OCB</option>
          </select>
        </div>
        <div>
          <label class="field-label" for="accountNumber">Số tài khoản</label>
          <input id="accountNumber" class="input" type="text" placeholder="VD: 0123456789" inputmode="numeric">
        </div>
        <div>
          <label class="field-label" for="accountName">Tên chủ tài khoản (in hoa)</label>
          <input id="accountName" class="input" type="text" placeholder="VD: NGUYEN VAN A" style="text-transform:uppercase">
        </div>
        <button class="btn primary" type="button" onclick="saveBankConfig()" style="min-height:48px">
          💾 Lưu cấu hình ngân hàng
        </button>
        <div id="bankConfigStatus" style="text-align:center;font-size:.84rem;color:var(--muted);min-height:20px"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/admin-auth.js"></script>
</body>
</html>
