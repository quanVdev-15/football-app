<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chốt thanh toán - Admin</title>
  <meta name="theme-color" content="#1b4332">
  <link rel="stylesheet" href="/css/style.css?v=4">
</head>
<body class="app-shell admin-page">
  <header class="topbar">
    <div>
      <p class="eyebrow">Admin</p>
      <h1>Chốt thanh toán</h1>
      <p id="sessionDateLabel" class="subtle">--</p>
    </div>
    <div class="topbar-actions">
      <a href="/admin/" class="chip-btn">Hub</a>
    </div>
  </header>

  <main id="adminContent" class="page" hidden>
    <section id="loadingState" class="state-card">
      <div class="spinner"></div>
      <p>Đang tải...</p>
    </section>

    <section id="emptyState" class="state-card" hidden>
      <h2>Chưa có buổi đá</h2>
      <p>Không tìm thấy buổi đá để chốt thanh toán.</p>
    </section>

    <section id="paymentContent" hidden>
      <article class="pay-hero-panel">
        <div class="section-head compact">
          <div>
            <h2>Tổng kết</h2>
            <p id="summarySessionDate">--</p>
          </div>
          <span id="closedBadge" class="status-badge is-open">Đang chốt</span>
        </div>
        <div class="pay-summary-grid">
          <div>
            <span>Cần thu</span>
            <strong id="totalExpected">0 ₫</strong>
          </div>
          <div>
            <span>Đã thu</span>
            <strong id="totalCollected">0 ₫</strong>
          </div>
          <div>
            <span>Còn lại</span>
            <strong id="totalOutstanding">0 ₫</strong>
          </div>
        </div>
      </article>

      <section class="pay-focus-grid">
        <button class="pay-focus-card danger" type="button" onclick="scrollToSection('unpaidSection')">
          <span>Chưa trả</span>
          <strong id="unpaidCount">0</strong>
          <small id="unpaidTotal">0 ₫</small>
        </button>
        <button class="pay-focus-card warning" type="button" onclick="scrollToSection('pendingSection')">
          <span>Chờ CK</span>
          <strong id="pendingCount">0</strong>
          <small id="pendingTotal">0 ₫</small>
        </button>
        <button class="pay-focus-card ok" type="button" onclick="scrollToSection('archiveSection')">
          <span>Đã xong</span>
          <strong id="doneCount">0</strong>
          <small id="doneTotal">0 ₫</small>
        </button>
      </section>

      <section id="unpaidSection" class="pay-panel">
        <div class="pay-panel-head">
          <div>
            <h2>🔴 Cần thu ngay</h2>
            <p>Ưu tiên người có nợ cũ, sau đó tiền buổi.</p>
          </div>
          <span id="unpaidPanelCount" class="pill">0</span>
        </div>
        <div id="unpaidList" class="pay-row-list"></div>
      </section>

      <section id="pendingSection" class="pay-panel">
        <div class="pay-panel-head">
          <div>
            <h2>Chờ xác nhận</h2>
            <p>Người chơi đã báo chuyển khoản.</p>
          </div>
          <span id="pendingPanelCount" class="pill">0</span>
        </div>
        <div id="pendingList" class="pay-row-list"></div>
      </section>

      <section id="archiveSection" class="pay-archive-grid">
        <button class="pay-archive-card" type="button" onclick="toggleSection('monthlyList')">
          <span>Thành viên tháng</span>
          <strong id="monthlyCount">0</strong>
          <small>Chạm để xem</small>
        </button>
        <button class="pay-archive-card" type="button" onclick="toggleSection('paidList')">
          <span>Đã trả</span>
          <strong id="paidCount">0</strong>
          <small>Chạm để xem</small>
        </button>
      </section>

      <div id="monthlyList" class="pay-row-list pay-archive-list" hidden></div>
      <div id="paidList" class="pay-row-list pay-archive-list" hidden></div>

      <button id="closeBtn" class="btn btn-danger btn-block pay-close-btn" type="button" onclick="closeAndCarryDebt()">
        Đóng thanh toán &amp; Ghi nợ
      </button>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/session-utils.js?v=1"></script>
  <script src="/js/admin-auth.js?v=4"></script>
  <script>
  const PAY_PER_PLAY = 35000;
  const PAY_MONTHLY = 150000;
  const VISIBLE_ACTION_ROWS = 5;

  let session = null;
  let sessionId = null;
  let monthKey = '';
  let rsvps = {};
  let payments = {};
  let subscriptions = {};
  let activeDebts = [];
  let unsubRsvps = null;
  let unsubPayments = null;
  let unsubDebts = null;
  let unsubSubs = null;
  let syncTimer = null;

  window.addEventListener('DOMContentLoaded', () => requireAuth(initPaymentAdmin));

  async function initPaymentAdmin() {
    document.getElementById('adminContent').hidden = false;
    session = await loadTargetSession();
    hide('loadingState');

    if (!session) {
      show('emptyState');
      return;
    }

    sessionId = session.id;
    const sessionDate = toDate(session.date || session.saturdayDate || session.id);
    monthKey = monthFromDate(sessionDate || new Date());
    document.getElementById('sessionDateLabel').textContent = sessionDate ? fmtDate(sessionDate) : '--';
    document.getElementById('summarySessionDate').textContent = sessionDate ? fmtDate(sessionDate) : '--';
    document.getElementById('paymentContent').hidden = false;

    subscribeRsvps();
    subscribePayments();
    subscribeDebts();
    subscribeSubscriptions();
  }

  async function loadTargetSession() {
    const params = new URLSearchParams(location.search);
    const sid = params.get('sessionId');
    if (sid) {
      const doc = await db.collection('sessions').doc(sid).get();
      return doc.exists ? { id: doc.id, ...doc.data() } : null;
    }
    return getActiveSession();
  }

  function subscribeRsvps() {
    if (unsubRsvps) unsubRsvps();
    unsubRsvps = db.collection('sessions').doc(sessionId).collection('rsvps')
      .onSnapshot(snap => {
        rsvps = {};
        snap.docs.forEach(doc => { rsvps[doc.id] = { id: doc.id, ...doc.data() }; });
        scheduleSync();
      });
  }

  function subscribePayments() {
    if (unsubPayments) unsubPayments();
    unsubPayments = db.collection('sessions').doc(sessionId).collection('payments')
      .onSnapshot(snap => {
        payments = {};
        snap.docs.forEach(doc => { payments[doc.id] = { id: doc.id, ...doc.data() }; });
        renderAll();
        scheduleSync();
      });
  }

  function subscribeDebts() {
    if (unsubDebts) unsubDebts();
    unsubDebts = db.collection('debts').where('cleared', '==', false)
      .onSnapshot(snap => {
        activeDebts = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))
          .filter(debt => debt.sessionId !== sessionId);
        renderAll();
        scheduleSync();
      });
  }

  function subscribeSubscriptions() {
    if (unsubSubs) unsubSubs();
    unsubSubs = db.collection('subscriptions').where('month', '==', monthKey)
      .onSnapshot(snap => {
        subscriptions = {};
        snap.docs.forEach(doc => {
          const data = doc.data();
          if (data.paid === true) subscriptions[data.playerId] = { id: doc.id, ...data };
        });
        scheduleSync();
      });
  }

  function scheduleSync() {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncPayments, 120);
  }

  async function syncPayments() {
    if (!sessionId) return;
    const batch = db.batch();
    let changed = false;

    Object.entries(payments).forEach(([pid, payment]) => {
      if (!isGoing(rsvps[pid])) {
        batch.delete(db.collection('sessions').doc(sessionId).collection('payments').doc(pid));
        changed = true;
      }
    });

    Object.entries(rsvps).forEach(([pid, rsvp]) => {
      if (!isGoing(rsvp)) return;

      const existing = payments[pid] || {};
      const subscription = subscriptions[pid] || null;
      const monthlyPaid = !!subscription;
      const validGuests = (rsvp.guests || []).filter(guest => guest.name?.trim());
      const guestAmount = validGuests.length * PAY_PER_PLAY;
      const debt = activeDebts
        .filter(item => item.playerId === pid)
        .reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const paid = monthlyPaid ? true : (existing.type === 'per-match' ? !!existing.paid : false);

      const data = {
        playerId: pid,
        playerName: rsvp.playerName || existing.playerName || '',
        type: monthlyPaid ? 'monthly' : 'per-match',
        amount: monthlyPaid ? 0 : PAY_PER_PLAY,
        paid,
        paidAt: paid ? (existing.paidAt || subscription?.paidAt || firebase.firestore.Timestamp.now()) : null,
        paidMethod: paid ? (existing.paidMethod || subscription?.paidMethod || null) : null,
        selfReported: existing.selfReported || false,
        selfReportedAt: existing.selfReportedAt || null,
        guestCount: validGuests.length,
        guestAmount,
        guestPaid: guestAmount > 0 ? !!existing.guestPaid : false,
        guestPaidAt: guestAmount > 0 ? (existing.guestPaidAt || null) : null,
        debt
      };

      if (!paymentChanged(existing, data)) return;
      batch.set(db.collection('sessions').doc(sessionId).collection('payments').doc(pid), data, { merge: true });
      changed = true;
    });

    if (changed) await batch.commit();
  }

  function paymentChanged(oldData, data) {
    return !oldData.playerId
      || oldData.playerName !== data.playerName
      || oldData.type !== data.type
      || oldData.amount !== data.amount
      || oldData.paid !== data.paid
      || oldData.paidMethod !== data.paidMethod
      || oldData.selfReported !== data.selfReported
      || oldData.guestCount !== data.guestCount
      || oldData.guestAmount !== data.guestAmount
      || oldData.guestPaid !== data.guestPaid
      || oldData.debt !== data.debt;
  }

  function renderAll() {
    const rows = Object.values(payments);
    const pending = rows.filter(payment => payment.selfReported && !payment.paid);
    const unpaid = rows.filter(payment => outstandingAmount(payment) > 0 && !pending.includes(payment))
      .sort((a, b) => (b.debt || 0) - (a.debt || 0) || a.playerName.localeCompare(b.playerName, 'vi'));
    const monthly = rows.filter(payment => payment.type === 'monthly' && payment.paid)
      .sort((a, b) => a.playerName.localeCompare(b.playerName, 'vi'));
    const paid = rows.filter(payment => payment.type === 'per-match' && outstandingAmount(payment) === 0 && payment.paid)
      .sort((a, b) => a.playerName.localeCompare(b.playerName, 'vi'));

    const unpaidTotal = unpaid.reduce((sum, payment) => sum + outstandingAmount(payment), 0);
    const pendingTotal = pending.reduce((sum, payment) => sum + payment.amount + payment.guestAmount + payment.debt, 0);
    const doneRows = [...monthly, ...paid];
    const doneTotal = doneRows.reduce((sum, payment) => sum + payment.amount + payment.guestAmount + payment.debt, 0);

    renderSummary(rows);
    renderList('unpaidList', unpaid, renderUnpaidRow, 'Không còn ai nợ.', VISIBLE_ACTION_ROWS);
    renderList('pendingList', pending, renderPendingRow, 'Không có chuyển khoản chờ xác nhận.', VISIBLE_ACTION_ROWS);
    renderList('monthlyList', monthly, renderMonthlyRow, 'Chưa có thành viên tháng đã đóng.');
    renderList('paidList', paid, renderPaidRow, 'Chưa có ai được xác nhận.');

    document.getElementById('unpaidCount').textContent = unpaid.length;
    document.getElementById('pendingCount').textContent = pending.length;
    document.getElementById('doneCount').textContent = doneRows.length;
    document.getElementById('unpaidPanelCount').textContent = unpaid.length;
    document.getElementById('pendingPanelCount').textContent = pending.length;
    document.getElementById('unpaidTotal').textContent = fmtVND(unpaidTotal);
    document.getElementById('pendingTotal').textContent = fmtVND(pendingTotal);
    document.getElementById('doneTotal').textContent = fmtVND(doneTotal);
    document.getElementById('monthlyCount').textContent = monthly.length;
    document.getElementById('paidCount').textContent = paid.length;

    const closed = !!session.paymentClosed;
    document.getElementById('closedBadge').textContent = closed ? 'Đã đóng' : 'Đang chốt';
    document.getElementById('closedBadge').className = `status-badge ${closed ? 'is-full' : 'is-open'}`;
  }

  function renderSummary(rows) {
    const expected = rows.reduce((sum, payment) => sum + payment.amount + payment.guestAmount + payment.debt, 0);
    const collected = rows.reduce((sum, payment) => {
      const ownPaid = payment.paid ? payment.amount : 0;
      const guestPaid = payment.guestPaid ? payment.guestAmount : 0;
      const debtPaid = payment.debt > 0 && payment.paid ? payment.debt : 0;
      return sum + ownPaid + guestPaid + debtPaid;
    }, 0);
    document.getElementById('totalExpected').textContent = fmtVND(expected);
    document.getElementById('totalCollected').textContent = fmtVND(collected);
    document.getElementById('totalOutstanding').textContent = fmtVND(Math.max(0, expected - collected));
  }

  function renderList(id, items, rowRenderer, emptyText, limit = null) {
    const el = document.getElementById(id);
    if (!items.length) {
      el.innerHTML = `<div class="pay-empty">${emptyText}</div>`;
      return;
    }

    const visible = limit ? items.slice(0, limit) : items;
    const hiddenCount = limit ? Math.max(0, items.length - limit) : 0;
    el.innerHTML = visible.map(rowRenderer).join('')
      + (hiddenCount ? `<button class="pay-more-btn" type="button" onclick="showFullList('${id}')">Xem thêm ${hiddenCount} người</button>` : '');
  }

  function showFullList(id) {
    if (id === 'unpaidList') {
      const pendingIds = new Set(Object.values(payments).filter(payment => payment.selfReported && !payment.paid).map(payment => payment.playerId));
      const unpaid = Object.values(payments).filter(payment => outstandingAmount(payment) > 0 && !pendingIds.has(payment.playerId))
        .sort((a, b) => (b.debt || 0) - (a.debt || 0) || a.playerName.localeCompare(b.playerName, 'vi'));
      renderList(id, unpaid, renderUnpaidRow, 'Không còn ai nợ.');
      return;
    }

    if (id === 'pendingList') {
      const pending = Object.values(payments).filter(payment => payment.selfReported && !payment.paid);
      renderList(id, pending, renderPendingRow, 'Không có chuyển khoản chờ xác nhận.');
    }
  }

  function renderUnpaidRow(payment) {
    return `
      <article class="pay-admin-row is-action" onclick="markPaidCash('${escAttr(payment.playerId)}')">
        <div>
          <strong>${esc(payment.playerName)}</strong>
          <span>${payment.debt > 0 ? `Nợ cũ ${fmtVND(payment.debt)} · ` : ''}${payment.guestAmount > 0 && !payment.guestPaid ? `Khách ${fmtVND(payment.guestAmount)} · ` : ''}${statusText(payment)}</span>
        </div>
        <div class="pay-row-side">
          <b>${fmtVND(outstandingAmount(payment))}</b>
          <button class="btn btn-sm btn-success" type="button" onclick="event.stopPropagation();markPaidCash('${escAttr(payment.playerId)}')">Tiền mặt</button>
        </div>
      </article>
    `;
  }

  function renderPendingRow(payment) {
    return `
      <article class="pay-admin-row">
        <div>
          <strong>${esc(payment.playerName)}</strong>
          <span>Chờ xác nhận chuyển khoản</span>
        </div>
        <div class="pay-row-side">
          <b>${fmtVND(payment.amount + payment.guestAmount + payment.debt)}</b>
          <button class="btn btn-sm btn-success" type="button" onclick="confirmTransfer('${escAttr(payment.playerId)}')">Xác nhận</button>
        </div>
      </article>
    `;
  }

  function renderMonthlyRow(payment) {
    return `
      <article class="pay-admin-row is-muted">
        <div>
          <strong>${esc(payment.playerName)}</strong>
          <span>Đã đóng tháng ${monthKey}</span>
        </div>
        <div class="pay-row-side">
          <b>Miễn phí</b>
          <span class="pay-badge">Tháng</span>
        </div>
      </article>
    `;
  }

  function renderPaidRow(payment) {
    return `
      <article class="pay-admin-row is-muted">
        <div>
          <strong>${esc(payment.playerName)}</strong>
          <span>${payment.paidMethod === 'transfer' ? 'Chuyển khoản' : 'Tiền mặt'}${payment.paidAt ? ` · ${fmtTime(toDate(payment.paidAt))}` : ''}</span>
        </div>
        <div class="pay-row-side">
          <b>${fmtVND(payment.amount + payment.guestAmount + payment.debt)}</b>
          <span class="pay-badge">Đã trả</span>
        </div>
      </article>
    `;
  }

  async function markPaidCash(pid) {
    await markPaid(pid, 'cash');
  }

  async function confirmTransfer(pid) {
    await markPaid(pid, 'transfer');
  }

  async function markPaid(pid, method) {
    const payment = payments[pid];
    if (!payment) return;

    try {
      const batch = db.batch();
      batch.set(db.collection('sessions').doc(sessionId).collection('payments').doc(pid), {
        paid: true,
        paidAt: firebase.firestore.FieldValue.serverTimestamp(),
        paidMethod: method,
        selfReported: false,
        guestPaid: payment.guestAmount > 0 ? true : payment.guestPaid,
        guestPaidAt: payment.guestAmount > 0 ? firebase.firestore.FieldValue.serverTimestamp() : payment.guestPaidAt
      }, { merge: true });

      activeDebts.filter(debt => debt.playerId === pid).forEach(debt => {
        batch.set(db.collection('debts').doc(debt.id), {
          cleared: true,
          clearedAt: firebase.firestore.FieldValue.serverTimestamp(),
          clearedSessionId: sessionId
        }, { merge: true });
      });

      await batch.commit();
      toast(method === 'transfer' ? 'Đã xác nhận chuyển khoản.' : 'Đã ghi nhận tiền mặt.', 'success');
    } catch (error) {
      console.error(error);
      toast('Không cập nhật được thanh toán.', 'error');
    }
  }

  async function closeAndCarryDebt() {
    const debtors = Object.values(payments).filter(payment => {
      if (payment.type !== 'per-match') return false;
      return !payment.paid || (payment.guestAmount > 0 && !payment.guestPaid);
    });

    if (!debtors.length) {
      await markSessionClosed();
      toast('Tất cả đã thanh toán.', 'success');
      return;
    }

    if (!confirm(`Ghi nợ ${debtors.length} người chưa trả?`)) return;

    try {
      const batch = db.batch();
      const sessionDate = toDate(session.date || session.saturdayDate || session.id) || new Date();
      debtors.forEach(payment => {
        const amount = (!payment.paid ? payment.amount : 0) + (!payment.guestPaid ? payment.guestAmount : 0);
        if (amount <= 0) return;
        batch.set(db.collection('debts').doc(`${sessionId}_${payment.playerId}`), {
          playerId: payment.playerId,
          playerName: payment.playerName,
          amount,
          sessionId,
          sessionDate: isoDate(sessionDate),
          cleared: false,
          clearedAt: null,
          clearedSessionId: null,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
      });
      batch.set(db.collection('sessions').doc(sessionId), {
        status: 'done',
        paymentClosed: true,
        paymentClosedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      await batch.commit();
      session.paymentClosed = true;
      renderAll();
      toast(`Ghi nợ ${debtors.length} người`, 'success');
    } catch (error) {
      console.error(error);
      toast('Không đóng được thanh toán.', 'error');
    }
  }

  async function markSessionClosed() {
    await db.collection('sessions').doc(sessionId).set({
      status: 'done',
      paymentClosed: true,
      paymentClosedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    session.paymentClosed = true;
    renderAll();
  }

  function outstandingAmount(payment) {
    const own = payment.type === 'per-match' && !payment.paid ? payment.amount : 0;
    const guest = payment.guestAmount > 0 && !payment.guestPaid ? payment.guestAmount : 0;
    const debt = payment.debt > 0 ? payment.debt : 0;
    return own + guest + debt;
  }

  function statusText(payment) {
    if (payment.debt > 0) return 'Có nợ cũ';
    if (payment.guestAmount > 0 && !payment.guestPaid) return 'Chưa trả tiền khách';
    return 'Chưa trả theo buổi';
  }

  function toggleSection(id) {
    const el = document.getElementById(id);
    el.hidden = !el.hidden;
  }

  function scrollToSection(id) {
    document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function isGoing(data) {
    return !!data && ['in', 'going'].includes(data.status || data.vote);
  }

  function monthFromDate(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
  }

  function isoDate(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  }

  function toDate(value) {
    if (!value) return null;
    if (value.toDate) return value.toDate();
    if (value instanceof Date) return value;
    return new Date(String(value).includes('T') ? value : `${value}T00:00:00`);
  }

  function fmtDate(date) {
    return new Intl.DateTimeFormat('vi-VN', {
      weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
    }).format(date);
  }

  function fmtTime(date) {
    return new Intl.DateTimeFormat('vi-VN', { hour: '2-digit', minute: '2-digit' }).format(date);
  }

  function fmtVND(amount) {
    return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount || 0);
  }

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    }[char]));
  }

  function escAttr(value) {
    return esc(value).replace(/`/g, '&#096;');
  }

  function show(id) { document.getElementById(id).hidden = false; }
  function hide(id) { document.getElementById(id).hidden = true; }

  function toast(message, type = '') {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.className = `toast show ${type}`;
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.className = 'toast'; }, 2400);
  }
  </script>
</body>
</html>
